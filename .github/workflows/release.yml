name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: .exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: "-android-aarch64"
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: "-macos-x64"
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: "-macos-arm64"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux/Android)
        if: runner.os == 'Linux'
        run: cargo install cross

      - name: Build
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/xfmt${{ matrix.suffix == '.exe' && '.exe' || '' }} dist/xfmt-${{ matrix.target }}${{ matrix.suffix }}
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfmt-${{ matrix.target }}
          path: dist/xfmt-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xfmt-*
          merge-multiple: true
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
