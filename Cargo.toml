[package]
name = "xfmt"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.102"
byteorder = "1.5.0"
clap = { version = "4.6.1", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
fastcdc = "4.0.1"
getrandom = "0.2.15"
hex = "0.4.3"
imagesize = "0.14.0"
mime_guess = "2.0.5"
pbkdf2 = "0.13.0"
rand = "0.8.5"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reed-solomon-erasure = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
walkdir = "2.5.0"
zstd = "0.13.3"
